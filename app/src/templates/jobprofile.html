<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobRec Profile Mockup</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

    <style>
      .avatar::before {
        content: "";
        position: absolute;
        width: 48px;
        height: 48px;
        background: #2b323d;
        border-radius: 50%;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
      }
      .avatar::after {
        content: "";
        position: absolute;
        width: 84px;
        height: 38px;
        background: #2b323d;
        border-radius: 36px 36px 14px 14px;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
      }
    </style>
  </head>
  <body class="m-0 font-sans bg-[#d9d9d9] text-[#111]">
    <div id="root"></div>

    <script id="user-info-data" type="application/json">
      {% if user_info is defined %}{{ user_info.model_dump_json() | safe }}{% else %}null{% endif %}
    </script>

    <script type="text/babel" data-type="module">
      {% if user_personal is defined %}
      const user_name = "{{ user_personal.name }}"
      const email = "{{ user_personal.email }}"
      const phone = "{{ user_personal.phone }}"
      const address = "{{ user_personal.address }}"
      {% else %}
      const user_name = "Jane Smith"
      const email = "jsmith@example.com"
      const phone = "(555) 393-9393"
      const address = "West Lafayette, IN"
      {% endif %}
      const userInfo = JSON.parse(document.getElementById("user-info-data").textContent);

      function Navbar() {
        return (
          <header className="bg-black text-white grid grid-cols-[1.5fr_1fr_1fr_1fr] items-center py-2.5 px-[18px] min-h-[58px]">
            <a href="/" className="text-[30px] justify-self-start no-underline text-white cursor-pointer">JobRec</a>
            <span className="text-[28px] justify-self-center opacity-50 cursor-default">Jobs</span>
            <span className="text-[28px] justify-self-center opacity-50 cursor-default">Search</span>
            <a href="/profile" className="text-[28px] justify-self-center text-white">Profile</a>
          </header>
        );
      }

      function Avatar() {
        return (
          <div className="relative w-[132px] h-[132px] mx-auto mt-6 mb-[22px]">
            <div className="avatar relative w-[132px] h-[132px] rounded-full bg-[#b1b3b7]"></div>
            <div className="absolute -right-0.5 bottom-2.5 w-7 h-7 rounded-full bg-white border-2 border-[#555] grid place-items-center text-[22px] leading-none text-[#555]">+</div>
          </div>
        );
      }

      function LeftPanel() {
        return (
          <section className="border-r border-[#bdbdbd] text-center flex flex-col justify-center p-[34px_34px_40px] md:border-r md:border-b-0 border-b">
            <h1 className="m-0 mb-6 text-[30px] font-bold">Your Profile</h1>
            <p className="m-0 text-2xl font-bold">{user_name}</p>
            <p className="m-0 mt-1 text-2xl font-bold">{email}</p>
            <p className="m-0 mt-1 text-2xl font-bold">{phone}</p>
            <div className="mt-2.5 text-[#9b9b9b] text-[17px] inline-flex items-center justify-center gap-1.5">
              <span>📍</span>
              <span>{address}</span>
            </div>
            

            <Avatar />

            <div className="text-xl font-bold my-2 mb-[18px]">Autofill Profile with Resume:</div>
            <form action="/upload" method="post" encType="multipart/form-data">
              <label htmlFor="resume" className="inline-flex items-center justify-center min-w-[260px] border-none rounded-2xl bg-black text-white text-[19px] font-bold py-4 px-6 cursor-pointer">
                Upload resume
              </label>
              <br /><br />
              <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" className="hidden" />
              <input type="submit" value="Submit" />
              <br /><br />
            </form>
          </section>
        );
      }

      function MenuItem({ label }) {
        return (
          <div className="flex items-center gap-4 my-[30px] text-2xl font-bold">
            <span className="w-[22px] h-[22px] border-[1.8px] border-[#444] rounded-full inline-flex items-center justify-center text-base text-[#444] shrink-0">+</span>
            <span>{label}</span>
          </div>
        );
      }

      function RightPanel() {
        if (userInfo) {
          return (
            <section className="relative flex flex-col justify-center p-[34px_34px_40px]">
              <h2 className="m-0 mb-7 text-center text-[26px] font-bold">Your current information:</h2>
              <div className="mx-auto max-w-[320px] w-full">
                <MenuItem label="Education:" />
                <ul>
                  {userInfo.education.map((edu, i) => (
                    <li key={i}>{edu.degree} from {edu.school}</li>
                  ))}
                </ul>

                <MenuItem label="Work Experience:" />
                <ul>
                  {userInfo.employment_history.map((work, i) => (
                    <li key={i}>{work.role} at {work.company_name}</li>
                  ))}
                </ul>

                <MenuItem label="Projects:" />
                <ul>
                  {userInfo.projects.map((project, i) => (
                    <li key={i}>{project}</li>
                  ))}
                </ul>

                <MenuItem label="Skills:" />
                <ul>
                  {userInfo.skills.map((skill, i) => (
                    <li key={i}>{skill.skill_name}: {skill.proficiency_level}/4</li>
                  ))}
                </ul>

                <MenuItem label="Socials:" />
                <ul>
                  {userInfo.socials.map((social, i) => (
                    <li key={i}><a href={social.url} target="_blank" rel="noreferrer">{social.platform}</a></li>
                  ))}
                </ul>
              </div>
            </section>
          );
        }

        return (
          <section className="relative flex flex-col justify-center p-[34px_34px_40px]">
            <h2 className="m-0 mb-7 text-center text-[26px] font-bold">Or, Manually Add Information:</h2>
            <div className="mx-auto max-w-[320px] w-full">
              <MenuItem label="Education:" />
              <MenuItem label="Work Experience:" />
              <MenuItem label="Projects:" />
              <MenuItem label="Skills:" />
              <MenuItem label="Socials:" />
            </div>
          </section>
        );
      }

      function ProfilePage() {
        return (
          <div className="min-h-screen">
            <div className="w-full min-h-screen bg-[#f4f4f4]">
              <Navbar />
              <main className="grid md:grid-cols-[42%_58%] grid-cols-1 min-h-[calc(100vh-58px)] items-stretch">
                <LeftPanel />
                <RightPanel />
              </main>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<ProfilePage />);
    </script>
  </body>
</html>
