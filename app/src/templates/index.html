<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JobRec</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
</head>

<body class="m-0 bg-white font-['Inter',sans-serif]">

  <div id="root"></div>

  <script type="text/babel" data-type="module">
    const { useState } = React;

    function Navbar() {
      return (
        <header className="bg-black text-white grid grid-cols-[1.5fr_1fr_1fr_1fr] items-center py-2.5 px-[18px] min-h-[58px] w-full fixed top-0 left-0">
          <a href="/" className="text-[30px] font-bold justify-self-start no-underline text-white">JobRec</a>
          <span className="text-[28px] font-bold justify-self-center opacity-50 cursor-default">Jobs</span>
          <span className="text-[28px] font-bold justify-self-center opacity-50 cursor-default">Search</span>
          <a href="/profile" className="text-[28px] font-bold justify-self-center text-white">Profile</a>
        </header>
      );
    }

    function Home() {
      return (
        <div className="flex flex-col items-center min-h-screen pt-20 text-center">
          <Navbar />
          <div className="text-[96px] font-bold text-black mt-20 mb-5">JobRec</div>
          <div className="text-[22px] max-w-[800px] text-black mb-[30px] leading-relaxed">
            The applicant-focused job board you didn't know you needed!
          </div>
          <div className="text-[15px] text-black">
            Sharvari Deshpande, Luna Brown, Luke McCartney, and Pranav Putta
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Home />);
  </script>
</body>
</html>
