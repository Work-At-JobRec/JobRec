<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobRec Profile Mockup</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

    <style>
      .avatar::before {
        content: "";
        position: absolute;
        width: 48px;
        height: 48px;
        background: #2b323d;
        border-radius: 50%;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
      }
      .avatar::after {
        content: "";
        position: absolute;
        width: 84px;
        height: 38px;
        background: #2b323d;
        border-radius: 36px 36px 14px 14px;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
      }
      .spinner {
        border: 10px solid #f7c6da;
        border-top: 10px solid #ff2d8d;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="m-0 font-sans bg-[#d9d9d9] text-[#111]">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
      const { useEffect } = React;

      function Navbar() {
        return (
          <header className="bg-black text-white grid grid-cols-[1.5fr_1fr_1fr_1fr] items-center py-2.5 px-[18px] min-h-[58px]">
            <a href="/" className="text-[30px] justify-self-start no-underline text-white cursor-pointer">JobRec</a>
            <span className="text-[28px] justify-self-center opacity-50 cursor-default">Jobs</span>
            <span className="text-[28px] justify-self-center opacity-50 cursor-default">Search</span>
            <a href="/profile" className="text-[28px] justify-self-center text-white">Profile</a>
          </header>
        );
      }

      function Avatar() {
        return (
          <div className="relative w-[132px] h-[132px] mx-auto mt-6 mb-[22px]">
            <div className="avatar relative w-[132px] h-[132px] rounded-full bg-[#b1b3b7]"></div>
          </div>
        );
      }

      function MenuItem({ label }) {
        return (
          <div className="flex items-center gap-4 my-[30px] text-2xl font-bold">
            <span className="w-[22px] h-[22px] border-[1.8px] border-[#444] rounded-full inline-flex items-center justify-center text-base text-[#444] shrink-0">+</span>
            <span>{label}</span>
          </div>
        );
      }

      function ProcessingPage() {
        useEffect(() => {
          const timer = setTimeout(() => window.location.reload(), 2000);
          return () => clearTimeout(timer);
        }, []);

        return (
          <div className="min-h-screen">
            <div className="w-full min-h-screen bg-[#f4f4f4]">
              <Navbar />
              <main className="grid md:grid-cols-[42%_58%] grid-cols-1 min-h-[calc(100vh-58px)] items-stretch">
                <section className="border-r border-[#bdbdbd] text-center flex flex-col justify-center p-[34px_34px_40px] md:border-r md:border-b-0 border-b">
                  <h1 className="m-0 mb-6 text-[30px] font-bold">Your Profile</h1>
                  <p className="m-0 text-2xl font-bold">Jane Smith</p>
                  <p className="m-0 mt-1 text-2xl font-bold">janesmith100@gmail.com</p>
                  <p className="m-0 mt-1 text-2xl font-bold">(+1) 650-890-0093</p>
                  <div className="mt-2.5 text-[#9b9b9b] text-[17px] inline-flex items-center justify-center gap-1.5">
                    <span>📍</span>
                    <span>West Lafayette, IN</span>
                  </div>

                  <Avatar />

                  <div className="text-black text-2xl mt-2 mb-[18px]">Parsing resume...</div>
                  <div className="spinner mx-auto my-[30px] w-[110px] h-[110px] rounded-full"></div>
                </section>

                <section className="relative flex flex-col justify-center p-[34px_34px_40px]">
                  <h2 className="m-0 mb-7 text-center text-[26px] font-bold">Your information will appear here:</h2>
                  <div className="mx-auto max-w-[320px] w-full">
                    <MenuItem label="Education:" />
                    <MenuItem label="Work Experience:" />
                    <MenuItem label="Projects:" />
                    <MenuItem label="Skills:" />
                    <MenuItem label="Socials:" />
                  </div>
                </section>
              </main>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<ProcessingPage />);
    </script>
  </body>
</html>
