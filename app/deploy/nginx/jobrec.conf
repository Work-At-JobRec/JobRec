limit_req_zone $binary_remote_addr zone=mylimit:10m rate=7r/s;

server{
        listen 80;
        listen [::]:80;
        server_name jobrec.thecoolsite.org;
        return 301 jobrec.thecoolsite.org$request_uri;
}

server{

        listen 443 ssl;
        listen [::]:443 ssl;
        server_name jobrec.thecoolsite.org;
        ssl_certificate            /etc/letsencrypt/live/jobrec.thecoolsite.org/fullchain.pem;
        ssl_certificate_key        /etc/letsencrypt/live/jobrec.thecoolsite.org/privkey.pem;


        location /api {
                include uwsgi_params;
                uwsgi_pass 127.0.0.1:3031;
        }

        location /upload {
                include uwsgi_params;
                uwsgi_pass 127.0.0.1:3031;
        }

        location / {
            root /opt/jobrec/frontend/dist;
        }
}

map $http_upgrade $connection_upgrade{
        default upgrade;
        '' close;
}
