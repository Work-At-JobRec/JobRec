# Analyzes newly scraped listings after the daily scrape has populated the queue.
# Needs DATABASE_URL and OPENAI_API_KEY repository secrets.

name: Extract listing skills

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum pending listings to analyze
        default: "50"
  schedule:
    - cron: "23 10 * * *"

permissions:
  contents: read

concurrency:
  group: extract-listing-skills
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LISTING_LIMIT: ${{ inputs.limit || '50' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require secrets
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is not set; refusing to use a throwaway SQLite database."
            exit 1
          fi
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is required for listing skill extraction."
            exit 1
          fi
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip poetry
          poetry install
      - name: Extract pending listing skills
        run: |
          set -o pipefail
          poetry run python -m jobrec.listing_skill_extractor --limit "$LISTING_LIMIT" | tee "$RUNNER_TEMP/extraction.txt"
      - name: Summary
        if: always()
        run: |
          {
            echo "### Listing skill extraction (limit: $LISTING_LIMIT)"
            echo '```'
            cat "$RUNNER_TEMP/extraction.txt" 2>/dev/null || echo "no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
