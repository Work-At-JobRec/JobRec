# Removes stored job listings whose application link shows the job is closed.
# Runs weekly, one hour after the Sunday scrape slot, and on demand from the Actions tab.
#
# Safe by default: a scheduled run is a dry run (it reports what it would remove) unless the
# repository variable PRUNE_DELETE is set to "true". A manual run removes listings only when the
# "delete" input is ticked. Needs the repository secret DATABASE_URL (the same value the deployment uses).

name: Prune closed jobs

on:
  workflow_dispatch:
    inputs:
      delete:
        description: Remove the listings found closed (unticked = dry run that only reports them)
        type: boolean
        default: false
      limit:
        description: Follow at most this many links (blank = all candidates)
        default: ""
  schedule:
    - cron: "23 10 * * 0"

permissions:
  contents: read

# Shares the scrape workflow's group so pruning never runs while a scrape is writing listings.
concurrency:
  group: scrape-jobs
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DELETE: ${{ github.event_name == 'schedule' && vars.PRUNE_DELETE == 'true' || inputs.delete == true }}
      LIMIT: ${{ inputs.limit }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require DATABASE_URL
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret DATABASE_URL is not set; refusing to prune a throwaway SQLite file."
            exit 1
          fi
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip poetry
          poetry install
      - name: Prune
        run: |
          set -o pipefail
          args=()
          if [ "$DELETE" = "true" ]; then args+=(--delete); fi
          if [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); fi
          echo "Started $(date -u +'%Y-%m-%d %H:%M:%S UTC') (mode: $([ "$DELETE" = "true" ] && echo delete || echo dry run))" | tee "$RUNNER_TEMP/prune.txt"
          poetry run python -m jobrec.prune_jobs "${args[@]}" 2>&1 | tee -a "$RUNNER_TEMP/prune.txt"
      - name: Summary
        if: always()
        run: |
          {
            echo "### Prune results"
            echo '```'
            cat "$RUNNER_TEMP/prune.txt" 2>/dev/null || echo "no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
