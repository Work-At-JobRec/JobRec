# Runs the job listing store tests against a real Postgres server.
# The main test workflow uses SQLite, which does not enforce column lengths or
# reject the same values Postgres does, so the production database's behaviour is checked here.

name: Job store on Postgres

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobrec
          POSTGRES_PASSWORD: jobrec
          POSTGRES_DB: jobrec_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobrec -d jobrec_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://jobrec:jobrec@localhost:5432/jobrec_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: app/src/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r app/src/requirements.txt
      - name: Test the job store on Postgres
        working-directory: app
        run: pytest test/test_job_store.py test/test_scrape_all_cli.py test/test_db.py -q
