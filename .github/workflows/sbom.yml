# Generates docs/SBOM.json, a CycloneDX software bill of materials, with Syft.
# It lists the packages installed for the build (backend Poetry environment and
# frontend node_modules) with their versions and licenses; see .syft.yaml.
# On main the regenerated file is committed back whenever a component changes.

name: SBOM

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip poetry
        cd app
        poetry config virtualenvs.in-project true
        poetry install --no-root --no-interaction

    - name: Set up Node 20
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci --no-audit --no-fund

    - name: Install Syft
      id: syft
      uses: anchore/sbom-action/download-syft@v0.24.3
      with:
        syft-version: v1.54.1

    - name: Generate docs/SBOM.json
      run: |
        version=$(grep -m1 '^version' app/pyproject.toml | cut -d'"' -f2)
        "${{ steps.syft.outputs.cmd }}" scan dir:. --config .syft.yaml \
          --source-name jobrec --source-version "$version" \
          -o cyclonedx-json=docs/SBOM.json

    - name: Check SBOM
      run: python .github/scripts/check_sbom.py docs/SBOM.json

    - name: Upload SBOM
      uses: actions/upload-artifact@v4
      with:
        name: SBOM
        path: docs/SBOM.json

    - name: Commit updated SBOM to main
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        # Ignore the serial number and timestamp, which change on every run.
        strip='del(.serialNumber, .metadata.timestamp)'
        if git cat-file -e HEAD:docs/SBOM.json 2>/dev/null && \
           diff <(git show HEAD:docs/SBOM.json | jq -S "$strip") <(jq -S "$strip" docs/SBOM.json) > /dev/null; then
          echo "SBOM unchanged"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898519+github-actions[bot]@users.noreply.github.com"
        git add docs/SBOM.json
        git commit -m "Update docs/SBOM.json [skip ci]"
        git pull --rebase origin main
        git push origin HEAD:main
